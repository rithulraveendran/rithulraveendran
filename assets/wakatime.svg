<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .meta { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
      .lang-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #f0f6fc; }
      .lang-time { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
      .lang-pct { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="818" height="198" x="1" y="1" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(30, 26)">
    <text class="title">Languages &amp; Development Telemetry (WakaTime)</text>
    <text x="760" y="0" text-anchor="end" class="meta">136 hrs 26 mins logged · Daily avg: 1 hr 37 mins</text>
  </g>

  <!-- Continuous Multi-segment Language Bar -->
  <g transform="translate(30, 38)">
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="760" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="0" y="0" width="249.2" height="8" fill="#3572A5" />     <!-- Python 32.79% -->
      <rect x="249.2" y="0" width="154.9" height="8" fill="#e34c26" /> <!-- HTML 20.38% -->
      <rect x="404.1" y="0" width="107.7" height="8" fill="#58a6ff" /> <!-- Markdown 14.17% -->
      <rect x="511.8" y="0" width="103.2" height="8" fill="#f1e05a" /> <!-- JavaScript 13.58% -->
      <rect x="615.0" y="0" width="26.1" height="8" fill="#3178c6" />  <!-- TypeScript 3.43% -->
      <rect x="641.1" y="0" width="16.5" height="8" fill="#89e051" />  <!-- Bash 2.17% -->
      <rect x="657.6" y="0" width="6.6" height="8" fill="#e38c00" />   <!-- SQL 0.87% -->
      <rect x="664.2" y="0" width="2.9" height="8" fill="#7d8590" />   <!-- C 0.38% -->
      <rect x="667.1" y="0" width="92.9" height="8" fill="#21262d" />  <!-- Other / Tools -->
    </g>
  </g>

  <!-- ==================== COLUMN 1 (LEFT) ==================== -->
  <!-- Python -->
  <g transform="translate(30, 68)">
    <circle cx="5" cy="5" r="4" fill="#3572A5" />
    <text x="18" y="9" class="lang-name">Python</text>
    <text x="105" y="9" class="lang-time">44 hrs 44 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="34.4" height="6" rx="3" fill="#3572A5" />
    <text x="330" y="9" class="lang-pct">32.79%</text>
  </g>

  <!-- HTML -->
  <g transform="translate(30, 98)">
    <circle cx="5" cy="5" r="4" fill="#e34c26" />
    <text x="18" y="9" class="lang-name">HTML</text>
    <text x="105" y="9" class="lang-time">27 hrs 48 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="21.4" height="6" rx="3" fill="#e34c26" />
    <text x="330" y="9" class="lang-pct">20.38%</text>
  </g>

  <!-- Markdown -->
  <g transform="translate(30, 128)">
    <circle cx="5" cy="5" r="4" fill="#58a6ff" />
    <text x="18" y="9" class="lang-name">Markdown</text>
    <text x="105" y="9" class="lang-time">19 hrs 20 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="14.9" height="6" rx="3" fill="#58a6ff" />
    <text x="330" y="9" class="lang-pct">14.17%</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(30, 158)">
    <circle cx="5" cy="5" r="4" fill="#f1e05a" />
    <text x="18" y="9" class="lang-name">JavaScript</text>
    <text x="105" y="9" class="lang-time">18 hrs 31 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="14.3" height="6" rx="3" fill="#f1e05a" />
    <text x="330" y="9" class="lang-pct">13.58%</text>
  </g>

  <!-- ==================== COLUMN 2 (RIGHT) ==================== -->
  <!-- TypeScript -->
  <g transform="translate(435, 68)">
    <circle cx="5" cy="5" r="4" fill="#3178c6" />
    <text x="18" y="9" class="lang-name">TypeScript</text>
    <text x="105" y="9" class="lang-time">4 hrs 40 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="3.6" height="6" rx="3" fill="#3178c6" />
    <text x="330" y="9" class="lang-pct">3.43%</text>
  </g>

  <!-- Bash -->
  <g transform="translate(435, 98)">
    <circle cx="5" cy="5" r="4" fill="#89e051" />
    <text x="18" y="9" class="lang-name">Bash</text>
    <text x="105" y="9" class="lang-time">2 hrs 58 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="2.3" height="6" rx="3" fill="#89e051" />
    <text x="330" y="9" class="lang-pct">2.17%</text>
  </g>

  <!-- SQL -->
  <g transform="translate(435, 128)">
    <circle cx="5" cy="5" r="4" fill="#e38c00" />
    <text x="18" y="9" class="lang-name">SQL</text>
    <text x="105" y="9" class="lang-time">1 hr 10 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="1.2" height="6" rx="3" fill="#e38c00" />
    <text x="330" y="9" class="lang-pct">0.87%</text>
  </g>

  <!-- C -->
  <g transform="translate(435, 158)">
    <circle cx="5" cy="5" r="4" fill="#7d8590" />
    <text x="18" y="9" class="lang-name">C</text>
    <text x="105" y="9" class="lang-time">31 mins</text>
    <rect x="215" y="2" width="105" height="6" rx="3" fill="#21262d" />
    <rect x="215" y="2" width="1.0" height="6" rx="3" fill="#7d8590" />
    <text x="330" y="9" class="lang-pct">0.38%</text>
  </g>
</svg>
