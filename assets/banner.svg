<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c" />
      <stop offset="60%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>

    <!-- Carbon Fiber Pattern -->
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#08090c" />
      <path d="M 0 0 L 4 4 L 4 0 L 0 4 Z" fill="#13151f" opacity="0.45" />
      <path d="M 4 4 L 8 8 L 8 4 L 4 8 Z" fill="#13151f" opacity="0.45" />
    </pattern>

    <!-- F1 Racing Red Gradient -->
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#b30500" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Titillium Web", "Inter", "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 900; letter-spacing: 3.5px; fill: #ffffff; font-style: italic; }
      .role { font-size: 13.5px; font-weight: 700; letter-spacing: 2.5px; fill: #e10600; }
      .desc { font-size: 12.5px; font-weight: 400; letter-spacing: 0.5px; fill: #8a8f9d; }
      .tag { font-size: 10px; font-weight: 600; letter-spacing: 1px; fill: #c0c4ce; }
      .meta { font-size: 9.5px; font-weight: 500; letter-spacing: 1px; fill: #727785; }
    </style>
  </defs>

  <!-- Carbon Canvas -->
  <rect width="1200" height="260" fill="url(#bg)" />
  <rect width="1200" height="260" fill="url(#carbon)" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#1f232e" stroke-width="1" />

  <!-- Top F1 Red Racing Stripe -->
  <rect x="0" y="0" width="1200" height="3" fill="#141722" />
  <rect x="0" y="0" width="320" height="3" fill="url(#redStripe)" />
  <rect x="320" y="0" width="8" height="3" fill="#ffffff" />

  <!-- Left Angled Livery Accent -->
  <polygon points="40,24 46,24 30,236 24,236" fill="#e10600" opacity="0.9" />
  <polygon points="52,24 55,24 39,236 36,236" fill="#ffffff" opacity="0.25" />

  <!-- ==================== LEFT: IDENTITY ==================== -->
  <g transform="translate(74, 62)">
    <text x="0" y="0" class="sans title">RITHUL RAVEENDRAN</text>
    <text x="0" y="26" class="sans role">AI &amp; MACHINE LEARNING ENGINEER</text>
    <text x="0" y="48" class="sans desc">Multimodal Speech AI · Agentic Reasoning Graphs · High-Performance Backends</text>
  </g>

  <!-- Clean Minimal Tags -->
  <g transform="translate(74, 142)">
    <!-- Tag 1 -->
    <g>
      <rect x="0" y="0" width="168" height="26" rx="3" fill="#11131a" stroke="#252a37" stroke-width="1" />
      <rect x="0" y="0" width="3" height="26" rx="1" fill="#e10600" />
      <text x="12" y="17" class="mono tag">MULTIMODAL SPEECH</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="162" height="26" rx="3" fill="#11131a" stroke="#252a37" stroke-width="1" />
      <rect x="0" y="0" width="3" height="26" rx="1" fill="#ffffff" />
      <text x="12" y="17" class="mono tag">AGENTIC SYSTEMS</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="176" height="26" rx="3" fill="#11131a" stroke="#252a37" stroke-width="1" />
      <rect x="0" y="0" width="3" height="26" rx="1" fill="#e10600" />
      <text x="12" y="17" class="mono tag">DISTRIBUTED BACKENDS</text>
    </g>
  </g>

  <!-- ==================== RIGHT: MINIMAL CIRCUIT & SPEED TRACE AESTHETIC ==================== -->
  <g transform="translate(760, 48)">
    <!-- Panel Base -->
    <rect x="0" y="0" width="380" height="130" rx="4" fill="#0d0f16" stroke="#1f232e" stroke-width="1" />

    <!-- Subtle Circuit Contour Lines (Monza-inspired high-speed layout) -->
    <path d="M 40 90 L 140 90 Q 165 90 185 70 L 230 25 Q 245 12 265 12 L 315 12 Q 335 12 345 28 Q 355 45 340 60 L 305 92 Q 295 102 280 102 L 180 102 Q 155 102 140 102 L 40 102 Z" 
          fill="none" stroke="#262b3a" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Accent speed vector over track -->
    <path d="M 140 90 Q 165 90 185 70 L 230 25 Q 245 12 265 12 L 315 12" 
          fill="none" stroke="#e10600" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="315" cy="12" r="3" fill="#ffffff" />

    <!-- Corner Accents -->
    <line x1="8" y1="8" x2="8" y2="16" stroke="#e10600" stroke-width="1.5" />
    <line x1="8" y1="8" x2="16" y2="8" stroke="#e10600" stroke-width="1.5" />

    <text x="24" y="22" class="mono" font-size="8.5" font-weight="700" letter-spacing="1.5px" fill="#8a8f9d">TELEMETRY &amp; PERFORMANCE</text>
    <text x="24" y="42" class="sans" font-size="20" font-weight="900" font-style="italic" fill="#ffffff">HIGH-PERFORMANCE</text>
    <text x="24" y="58" class="sans" font-size="11" font-weight="600" letter-spacing="1px" fill="#e10600">SYSTEMS &amp; INTELLIGENCE</text>
  </g>

  <!-- ==================== BOTTOM: DIVIDER & METADATA ==================== -->
  <line x1="74" y1="216" x2="1140" y2="216" stroke="#1f232e" stroke-width="1" />

  <g transform="translate(74, 238)">
    <text x="0" y="0" class="mono meta">ST. JOSEPH'S COLLEGE OF ENGINEERING (AI &amp; ML) · SAINIK SCHOOL KAZHAKOOTAM</text>
    <text x="1066" y="0" text-anchor="end" class="mono meta" fill="#e10600">rithulraveendran.github.io</text>
  </g>
</svg>
