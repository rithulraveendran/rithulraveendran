<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.025" />
      <circle cx="0" cy="0" r="0.75" fill="#ffffff" fill-opacity="0.08" />
    </pattern>

    <!-- Core Box Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111620" />
      <stop offset="100%" stop-color="#0b0f16" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif; }
      .hero-name { font-size: 38px; font-weight: 800; letter-spacing: 3.5px; fill: #f0f6fc; }
      .hero-sub { font-size: 13.5px; font-weight: 600; letter-spacing: 2.5px; fill: #58a6ff; }
      .hero-desc { font-size: 12.5px; font-weight: 400; letter-spacing: 0.5px; fill: #8b949e; }
      .spec-pill { font-size: 10px; font-weight: 500; letter-spacing: 0.8px; fill: #c9d1d9; }
      .schem-label { font-size: 8.5px; font-weight: 600; letter-spacing: 0.5px; }
      .footer-meta { font-size: 9.5px; font-weight: 500; letter-spacing: 1px; fill: #6e7681; }
    </style>
  </defs>

  <!-- Base Surfaces -->
  <rect width="1200" height="280" fill="url(#bgGrad)" />
  <rect width="1200" height="280" fill="url(#archGrid)" />

  <!-- Outer Border Hairline -->
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#21262d" stroke-width="1" />

  <!-- Corner Crosshair Ticks -->
  <g stroke="#30363d" stroke-width="1">
    <path d="M 24 16 L 24 32 M 16 24 L 32 24" />
    <path d="M 1176 16 L 1176 32 M 1168 24 L 1184 24" />
    <path d="M 24 248 L 24 264 M 16 256 L 32 256" />
    <path d="M 1176 248 L 1176 264 M 1168 256 L 1184 256" />
  </g>

  <!-- ==================== LEFT: TYPOGRAPHY & IDENTITY ==================== -->
  <g transform="translate(64, 68)">
    <text x="0" y="0" class="sans hero-name">RITHUL RAVEENDRAN</text>
    <text x="0" y="26" class="sans hero-sub">AI &amp; MACHINE LEARNING ENGINEER · SYSTEMS BUILDER</text>
    <text x="0" y="48" class="sans hero-desc">Multimodal Intelligence · Agentic Decision Systems · Resilient Architectures</text>
  </g>

  <!-- Three Architecture Tags (Apple-Restraint Pills) -->
  <g transform="translate(64, 154)">
    <!-- Pill 1 -->
    <g>
      <rect x="0" y="0" width="198" height="26" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="17" class="mono spec-pill">[01] AGENTIC DECISION GRAPHS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="198" height="26" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="17" class="mono spec-pill">[02] MULTIMODAL SPEECH &amp; RAG</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(416, 0)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="17" class="mono spec-pill">[03] 700+ PROBLEMS SOLVED</text>
    </g>
  </g>

  <!-- ==================== RIGHT: AGENTIC REASONING & VECTOR RETRIEVAL SCHEMATIC ==================== -->
  <g transform="translate(690, 36)">
    <!-- Schematic Frame -->
    <rect x="0" y="0" width="446" height="172" rx="6" fill="#090c12" stroke="#21262d" stroke-width="1" />
    
    <!-- Schematic Header Bar -->
    <rect x="0" y="0" width="446" height="24" rx="6" fill="#0d1117" />
    <line x1="0" y1="24" x2="446" y2="24" stroke="#21262d" stroke-width="1" />
    <circle cx="14" cy="12" r="3" fill="#ff5f56" />
    <circle cx="24" cy="12" r="3" fill="#ffbd2e" />
    <circle cx="34" cy="12" r="3" fill="#27c93f" />
    <text x="52" y="15.5" class="mono schem-label" fill="#8b949e">REASONING_PIPELINE // LANGGRAPH_PGVECTOR.SYS</text>

    <!-- Stage 1: Multimodal Ingest -->
    <g transform="translate(18, 40)">
      <rect x="0" y="0" width="102" height="88" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" />
      <text x="51" y="24" text-anchor="middle" class="mono schem-label" fill="#8b949e">INGEST</text>
      <text x="51" y="44" text-anchor="middle" class="mono" font-size="8" fill="#58a6ff">Speech / Audio</text>
      <text x="51" y="58" text-anchor="middle" class="mono" font-size="7.5" fill="#6e7681">librosa feature</text>
      <text x="51" y="74" text-anchor="middle" class="mono" font-size="7.5" fill="#c9d1d9">dim: [B, 1536]</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(120, 80)">
      <line x1="0" y1="4" x2="24" y2="4" stroke="#58a6ff" stroke-width="1.2" />
      <polygon points="24,4 18,1 18,7" fill="#58a6ff" />
      <text x="12" y="-2" text-anchor="middle" class="mono" font-size="7" fill="#6e7681">EMBED</text>
    </g>

    <!-- Stage 2: LangGraph Decision Core -->
    <g transform="translate(148, 30)">
      <rect x="0" y="0" width="154" height="106" rx="5" fill="url(#coreGrad)" stroke="#58a6ff" stroke-width="1.2" />
      
      <!-- Header inside core -->
      <line x1="12" y1="26" x2="142" y2="26" stroke="#21262d" stroke-width="1" />
      <text x="77" y="18" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#f0f6fc">LANGGRAPH CORE</text>
      
      <text x="14" y="42" class="mono" font-size="8" fill="#c9d1d9">State Graph Orchestrator</text>
      <text x="14" y="56" class="mono" font-size="8" fill="#8b949e">Conditional Edge Routing</text>
      <text x="14" y="70" class="mono" font-size="8" fill="#8b949e">Agentic Tool Dispatch</text>
      <text x="14" y="88" class="mono" font-size="8" fill="#58a6ff">Decision Latency: &lt; 45ms</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(302, 80)">
      <line x1="0" y1="4" x2="24" y2="4" stroke="#58a6ff" stroke-width="1.2" />
      <polygon points="24,4 18,1 18,7" fill="#58a6ff" />
      <text x="12" y="-2" text-anchor="middle" class="mono" font-size="7" fill="#6e7681">QUERY</text>
    </g>

    <!-- Stage 3: Vector Storage & Retrieval -->
    <g transform="translate(330, 40)">
      <rect x="0" y="0" width="98" height="88" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="49" y="24" text-anchor="middle" class="mono schem-label" fill="#8b949e">PGVECTOR</text>
      <text x="49" y="44" text-anchor="middle" class="mono" font-size="8" fill="#58a6ff">HNSW Index</text>
      <text x="49" y="58" text-anchor="middle" class="mono" font-size="7.5" fill="#6e7681">Cosine Sim</text>
      <text x="49" y="74" text-anchor="middle" class="mono" font-size="7.5" fill="#c9d1d9">PostgreSQL DB</text>
    </g>

    <!-- Schematic Subtext -->
    <g transform="translate(18, 152)">
      <text x="0" y="7" class="mono" font-size="8" fill="#8b949e">AUTONOMOUS REASONING &amp; HIGH-DIMENSIONAL RETRIEVAL PIPELINE</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: TECHNICAL METADATA DIVIDER ==================== -->
  <line x1="64" y1="236" x2="1136" y2="236" stroke="#21262d" stroke-width="1" />

  <g transform="translate(64, 258)">
    <text x="0" y="0" class="mono footer-meta">ACADEMICS: ST. JOSEPH'S COLL. OF ENGG (AI &amp; ML) · ALUMNUS: SAINIK SCHOOL KAZHAKOOTAM</text>
    <text x="1072" y="0" text-anchor="end" class="mono footer-meta" fill="#58a6ff">PORTFOLIO: rithulraveendran.github.io</text>
  </g>
</svg>
