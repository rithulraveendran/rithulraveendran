<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="80">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>

    <pattern id="footCarbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#08090c" />
      <path d="M 0 0 L 4 4 L 4 0 L 0 4 Z" fill="#13151f" opacity="0.35" />
      <path d="M 4 4 L 8 8 L 8 4 L 4 8 Z" fill="#13151f" opacity="0.35" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Titillium Web", "Segoe UI", sans-serif; }
      .foot-title { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; fill: #ffffff; font-style: italic; }
      .foot-desc { font-size: 9.5px; font-weight: 600; letter-spacing: 1px; fill: #727785; }
      .foot-link { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #e10600; }
    </style>
  </defs>

  <!-- Base -->
  <rect width="1200" height="80" fill="url(#footBg)" />
  <rect width="1200" height="80" fill="url(#footCarbon)" />

  <!-- Top Line with F1 Red Accent -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#1f232e" stroke-width="1" />
  <rect x="74" y="0" width="140" height="2" fill="#e10600" />
  <rect x="214" y="0" width="6" height="2" fill="#ffffff" />

  <!-- Content -->
  <g transform="translate(74, 46)">
    <text x="0" y="0" class="sans foot-title">RITHUL RAVEENDRAN</text>
    <text x="0" y="16" class="mono foot-desc">AI &amp; MACHINE LEARNING // SYSTEMS ARCHITECTURE</text>
  </g>

  <g transform="translate(1126, 46)">
    <text x="0" y="0" text-anchor="end" class="mono foot-desc">2026</text>
    <text x="0" y="16" text-anchor="end" class="mono foot-link">rithulraveendran.github.io</text>
  </g>
</svg>
