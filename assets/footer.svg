<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="110">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Inverted Arch Gradient -->
    <radialGradient id="footerArch" cx="50%" cy="110" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#0369a1" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#082f49" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
    </radialGradient>

    <style>
      .footer-title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #ffffff;
      }
      .footer-sub {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 2.2px;
        fill: #7dd3fc;
      }
      .wireframe {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 1.5;
        stroke-opacity: 0.55;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="110" fill="url(#footerBg)" />

  <!-- Inverted Glowing Dome Arch at Bottom -->
  <ellipse cx="600" cy="110" rx="360" ry="90" fill="url(#footerArch)" />

  <!-- Left Wireframe Accents -->
  <g transform="translate(140, 42)">
    <polygon points="0,20 18,0 48,0 30,20" class="wireframe" />
    <polygon points="36,20 54,0 84,0 66,20" class="wireframe" />
    <polygon points="72,20 90,0 120,0 102,20" class="wireframe" />
  </g>

  <!-- Center Typography -->
  <text x="600" y="52" text-anchor="middle" class="footer-title">THANKS FOR VISITING</text>
  <text x="600" y="74" text-anchor="middle" class="footer-sub">ENGINEERED WITH CARE · RITHUL RAVEENDRAN</text>

  <!-- Right Wireframe Accents -->
  <g transform="translate(940, 42)">
    <polygon points="0,20 18,0 48,0 30,20" class="wireframe" />
    <polygon points="36,20 54,0 84,0 66,20" class="wireframe" />
    <polygon points="72,20 90,0 120,0 102,20" class="wireframe" />
  </g>
</svg>
